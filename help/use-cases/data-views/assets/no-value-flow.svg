<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000" role="img" aria-labelledby="no-value-flow-title no-value-flow-desc">
  <title id="no-value-flow-title">Decision flow for handling No value in Customer Journey Analytics</title>
  <desc id="no-value-flow-desc">Source data is ingested into Adobe Experience Platform, then into Customer Journey Analytics as AEP data sets. Customer Journey Analytics checks whether a dimension value is present. If a value is present, it's a valid value. If no value is present, Customer Journey Analytics checks whether the missing value is an expected scenario. If yes, it's a natural No value, for example a pre-login state. If no, it's a problematic No value, for example failed data collection.</desc>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#464646"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1473E6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#268E6C"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9256D9"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E34850"/>
    </marker>
  </defs>

  <g font-family="'Adobe Clean', 'Adobe Clean VF', Arial, sans-serif">

    <!-- Source data -->
    <rect x="200" y="20" width="500" height="60" rx="8" fill="#FFECD9" stroke="#E9730C" stroke-width="2"/>
    <text x="450" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#8A4600">Source data</text>

    <line x1="450" y1="80" x2="450" y2="146" stroke="#464646" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="465" y="118" font-size="14" font-weight="700" fill="#464646">Ingestion</text>

    <!-- Adobe Experience Platform -->
    <rect x="200" y="150" width="500" height="60" rx="8" fill="#FFEBE9" stroke="#E34850" stroke-width="2"/>
    <text x="450" y="185" text-anchor="middle" font-size="17" font-weight="700" fill="#B3181D">Adobe Experience Platform (AEP)</text>

    <line x1="450" y1="210" x2="450" y2="276" stroke="#464646" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="465" y="248" font-size="14" font-weight="700" fill="#464646">AEP data sets</text>

    <!-- Customer Journey Analytics -->
    <rect x="200" y="280" width="500" height="60" rx="8" fill="#E6F4FF" stroke="#1473E6" stroke-width="2"/>
    <text x="450" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#0B5CAB">Customer Journey Analytics (CJA)</text>

    <line x1="450" y1="340" x2="450" y2="386" stroke="#464646" stroke-width="2" marker-end="url(#arrow-gray)"/>

    <!-- Diamond 1: Dimension value present? -->
    <polygon points="450,390 560,470 450,550 340,470" fill="#FFFFFF" stroke="#1473E6" stroke-width="2"/>
    <text x="450" y="464" text-anchor="middle" font-size="14" font-weight="700" fill="#0B5CAB">Dimension value</text>
    <text x="450" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#0B5CAB">present?</text>

    <!-- No -> Diamond 2 -->
    <line x1="340" y1="470" x2="284" y2="586" stroke="#1473E6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="255" y="525" font-size="15" font-weight="700" fill="#1473E6">No</text>

    <!-- Yes -> Valid value -->
    <line x1="560" y1="470" x2="696" y2="646" stroke="#268E6C" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="640" y="548" font-size="15" font-weight="700" fill="#268E6C">Yes</text>

    <!-- Diamond 2: Expected scenario? -->
    <polygon points="280,590 380,660 280,730 180,660" fill="#FFFFFF" stroke="#1473E6" stroke-width="2"/>
    <text x="280" y="654" text-anchor="middle" font-size="14" font-weight="700" fill="#0B5CAB">Expected</text>
    <text x="280" y="672" text-anchor="middle" font-size="14" font-weight="700" fill="#0B5CAB">scenario?</text>

    <!-- Yes -> Natural No value -->
    <line x1="180" y1="660" x2="154" y2="756" stroke="#9256D9" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="115" y="715" font-size="15" font-weight="700" fill="#9256D9">Yes</text>

    <!-- No -> Problematic No value -->
    <line x1="380" y1="660" x2="416" y2="756" stroke="#E34850" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="425" y="715" font-size="15" font-weight="700" fill="#E34850">No</text>

    <!-- Natural No value -->
    <rect x="40" y="760" width="220" height="60" rx="8" fill="#9256D9"/>
    <text x="150" y="796" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Natural No value</text>

    <line x1="150" y1="820" x2="150" y2="896" stroke="#464646" stroke-width="2" marker-end="url(#arrow-gray)"/>

    <rect x="30" y="900" width="240" height="60" rx="8" fill="#F5F5F5" stroke="#B3B3B3" stroke-width="1.5"/>
    <text x="150" y="935" text-anchor="middle" font-size="13" fill="#464646">Example: pre-login state</text>

    <!-- Problematic No value -->
    <rect x="310" y="760" width="220" height="60" rx="8" fill="#E34850"/>
    <text x="420" y="796" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Problematic No value</text>

    <line x1="420" y1="820" x2="420" y2="896" stroke="#464646" stroke-width="2" marker-end="url(#arrow-gray)"/>

    <rect x="300" y="900" width="240" height="60" rx="8" fill="#F5F5F5" stroke="#B3B3B3" stroke-width="1.5"/>
    <text x="420" y="935" text-anchor="middle" font-size="13" fill="#464646">Example: failed data collection</text>

    <!-- Valid value -->
    <rect x="590" y="650" width="220" height="60" rx="8" fill="#268E6C"/>
    <text x="700" y="686" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Valid value</text>

    <line x1="700" y1="710" x2="700" y2="896" stroke="#464646" stroke-width="2" marker-end="url(#arrow-gray)"/>

    <rect x="580" y="900" width="240" height="60" rx="8" fill="#F5F5F5" stroke="#B3B3B3" stroke-width="1.5"/>
    <text x="700" y="935" text-anchor="middle" font-size="13" fill="#464646">Example: post-login state</text>

  </g>
</svg>
